# HostPog local infrastructure. Development defaults only — never reuse these
# credentials in production. Host ports come from .env (POSTGRES_PORT, CLICKHOUSE_HTTP_PORT,
# REDIS_PORT) and bind to 127.0.0.1 only. Postgres defaults to 5433 to avoid clashing with
# an existing local Postgres on 5432.
name: hostpog

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hostpog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hostpog_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-hostpog}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hostpog}"]
      interval: 3s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-hostpog}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-hostpog_dev_only}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-hostpog}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"]
    volumes: [chdata:/var/lib/clickhouse]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    # Local mock SMTP for email-link / verification mails. UI on :8025.
    image: axllent/mailpit:v1.27
    profiles: ["mail"]
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  chdata:
  redisdata:
