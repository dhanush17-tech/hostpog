name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: hostpog, POSTGRES_PASSWORD: hostpog_ci, POSTGRES_DB: hostpog }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hostpog" --health-interval 3s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        env: { CLICKHOUSE_USER: hostpog, CLICKHOUSE_PASSWORD: hostpog_ci, CLICKHOUSE_DB: hostpog, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1" }
        ports: ["8123:8123"]
    env:
      DATABASE_URL: postgres://hostpog:hostpog_ci@localhost:5432/hostpog
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: hostpog
      CLICKHOUSE_PASSWORD: hostpog_ci
      CLICKHOUSE_DB: hostpog
      HOSTPOG_PUBLIC_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: secrets for this run
        run: |
          echo "HOSTPOG_MASTER_KEY=$(openssl rand -base64 32)" >> $GITHUB_ENV
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm --filter @hostpog/web build
      - run: pnpm --filter @hostpog/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --prod --audit-level high
